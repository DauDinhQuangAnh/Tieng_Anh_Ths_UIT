name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sync Web Assets into Flutter App
        run: |
          mkdir -p flutter_app/assets/web/data
          cp index.html styles.css app.js manifest.json sw.js flutter_app/assets/web/
          cp data/*.js flutter_app/assets/web/data/

      - name: Generate Android Platform Files & Build Release APK
        working-directory: ./flutter_app
        run: |
          flutter create --platforms=android --org vn.edu.hcmus .
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCMUS-Master-English-2026-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
